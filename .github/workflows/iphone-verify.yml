
name: CleanFrame iPhone Verify

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iphone-verify.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check
      - run: npm run check:tools
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: CLEANFRAME_PUBLIC_FONTS=1 npm run check:browser
      - run: npm run export:public
      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-iPhone-WGT
          path: |
            dist/CleanFrame-public-unsigned.wgt
            dist/public-export.json
